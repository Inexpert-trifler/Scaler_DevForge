age_band_years: 10         # 10-year bands (e.g. "40-49") — reduces voter roll quasi-identifier linkage
age_band_years_coarsen: 20 # 20-year band for rare k-anon cells
age_top_code: 80           # ages >= 80 -> "80+" (top-code to protect elderly re-id trap)
date_shift_max_days: 180   # per-patient HMAC offset in [-180, 180] \ {0}
k_min: 5                   # k-anonymity threshold for targeted coarsening
min_confidence: 0.5        # mentions below are ignored
pin_keep_digits: 1         # 1-digit state prefix (e.g. 2*****) — eliminates voter roll linkage
village_action: remove     # remove village entirely — eliminates local voter roll linkage
dob_action: year           # year | shift   (see DECISIONS D-012)
link_age_tolerance: 1
link_conflict_age_gap: 4
psn_prefix: "PSN-"
tokens:                    # replacement tokens
  PATIENT_NAME: "[NAME]"   # replaced by the PSN when the unit has one
  RELATIVE_NAME: "[RELATIVE]"
  PHONE: "[PHONE]"
  AADHAAR: "[AADHAAR]"
  AADHAAR_MASKED: "[AADHAAR]"
  ABHA_NUMBER: "[ABHA]"
  ABHA_ADDRESS: "[ABHA]"
  PAN: "[PAN]"
  MRN: "[MRN]"
  INSURANCE_ID: "[INSURANCE]"
  EMAIL: "[EMAIL]"
  HOUSE: "[ADDRESS]"
  LANDMARK: "[ADDRESS]"
  LOCALITY: "[ADDRESS]"
  VILLAGE: "[AREA]"
  OTHER_PERSON: "[NAME]"
